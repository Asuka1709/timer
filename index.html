<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林風計時碼表</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #0b2e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .stopwatch-container {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(to bottom, #0e3a27, #072216);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* 上半部：計時錶盤區 */
        .display-section {
            position: relative;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #0e3a27 0%, #072216 100%);
        }
        /* 裝飾葉子與香菇 */
        .decor {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
        }
        .leaf1 { top: 20%; left: 15%; color: #4ade80; transform: rotate(-15deg); }
        .leaf2 { top: 50%; right: 12%; color: #22c55e; transform: rotate(45deg); }
        .mushroom1 { bottom: 15%; left: 18%; }
        .mushroom2 { top: 15%; right: 20%; }

        /* 實體錶盤 */
        .dial {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 8px solid #22c55e;
            background: radial-gradient(circle, #5c3a21 0%, #3d2514 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 錶冠 */
        .dial::before {
            content: '';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 14px;
            background-color: #5c3a21;
            border: 3px solid #22c55e;
            border-radius: 4px 4px 0 0;
        }
        /* 刻度文字 */
        .label {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            color: #fcd34d;
        }
        .label-60 { top: 10px; }
        .label-15 { right: 12px; }
        .label-30 { bottom: 10px; }
        .label-45 { left: 12px; }

        /* 指針 */
        .pointer-center {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #fcd34d;
            border-radius: 50%;
            z-index: 10;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: calc(50% - 2px);
            width: 4px;
            height: 110px;
            background-color: #fcd34d;
            transform-origin: bottom center;
            transform: rotate(0deg);
            border-radius: 4px 4px 0 0;
            z-index: 5;
        }

        /* 錶盤內數位時間 */
        .dial-digital {
            position: absolute;
            bottom: 75px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #22c55e;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            color: #4ade80;
            letter-spacing: 1px;
        }

        /* 中間部：資訊數據區 */
        .info-section {
            display: flex;
            background-color: #ffffff;
            color: #333333;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }
        .info-box {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            border-right: 1px solid #e5e7eb;
        }
        .info-box:last-child {
            border-right: none;
        }
        .info-title {
            font-size: 13px;
            color: #666666;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .info-value {
            font-size: 18px;
            font-weight: bold;
            font-family: monospace, sans-serif;
        }

        /* 下半部：控制按鈕區 */
        .control-section {
            background-color: #f9fafb;
            padding: 24px;
            display: flex;
            gap: 16px;
        }
        .btn {
            flex: 1;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-reset {
            background-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }
        .btn-reset.enabled {
            background-color: #dedede;
            color: #4b5563;
            cursor: pointer;
        }
        .btn-reset.enabled:hover {
            background-color: #d1d5db;
        }
        .btn-start {
            background-color: #059669;
            color: #ffffff;
        }
        .btn-start:hover {
            background-color: #047857;
        }
        .btn-pause {
            background-color: #d97706;
            color: #ffffff;
        }
        .btn-pause:hover {
            background-color: #b45309;
        }
    </style>
</head>
<body>

<div class="stopwatch-container">
    <!-- 錶盤視覺區 -->
    <div class="display-section">
        <!-- 裝飾元素 -->
        <div class="decor leaf1">🍃</div>
        <div class="decor leaf2">🍃</div>
        <div class="decor mushroom1">🍄</div>
        <div class="decor mushroom2">🍄</div>
        
        <div class="dial">
            <div class="label label-60">60</div>
            <div class="label label-15">15</div>
            <div class="label label-30">30</div>
            <div class="label label-45">45</div>
            
            <div class="hand" id="dialHand"></div>
            <div class="pointer-center"></div>
            
            <div class="dial-digital" id="dialDigital">00:00.00</div>
        </div>
    </div>

    <!-- 數據資訊欄 -->
    <div class="info-section">
        <div class="info-box">
            <div class="info-title">當前時間</div>
            <div class="info-value" id="infoCurrent">00:00.00</div>
        </div>
        <div class="info-box">
            <div class="info-title">計圈總數</div>
            <div class="info-value">0</div>
        </div>
        <div class="info-box">
            <div class="info-title">最新單圈</div>
            <div class="info-value">--</div>
        </div>
    </div>

    <!-- 控制按鈕欄 -->
    <div class="control-section">
        <button class="btn btn-reset" id="resetBtn" disabled>重設</button>
        <button class="btn btn-start" id="startBtn">▶ 開始</button>
    </div>
</div>

<script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let currentState = 'index'; // index, start, pause

    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dialHand = document.getElementById('dialHand');
    const dialDigital = document.getElementById('dialDigital');
    const infoCurrent = document.getElementById('infoCurrent');

    function updateDisplay() {
        // 計算分、秒、毫秒 (百 lip)
        let totalMilliseconds = elapsedTime;
        let minutes = Math.floor(totalMilliseconds / 60000);
        let seconds = Math.floor((totalMilliseconds % 60000) / 1000);
        let milliseconds = Math.floor((totalMilliseconds % 1000) / 10);

        // 格式化字串
        let minStr = String(minutes).padStart(2, '0');
        let secStr = String(seconds).padStart(2, '0');
        let msStr = String(milliseconds).padStart(2, '0');
        let timeString = `${minStr}:${secStr}.${msStr}`;

        // 更新數位顯示
        dialDigital.textContent = timeString;
        infoCurrent.textContent = timeString;

        // 更新指針旋轉角度 (一圈 60 秒 = 360 度，每秒 6 度)
        let totalSeconds = totalMilliseconds / 1000;
        let degrees = (totalSeconds % 60) * 6;
        dialHand.style.transform = `rotate(${degrees}deg)`;
    }

    function startTimer() {
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
            elapsedTime = Date.now() - startTime;
            updateDisplay();
        }, 10);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
    }

    function resetTimer() {
        clearInterval(timerInterval);
        elapsedTime = 0;
        updateDisplay();
    }

    // 按鈕事件邏輯處理（嚴格遵循狀態機流程）
    startBtn.addEventListener('click', () => {
        if (currentState === 'index' || currentState === 'pause') {
            // 進入「開始計時」狀態
            startTimer();
            currentState = 'start';
            
            // UI 切換為暫停外觀
            startBtn.textContent = '⏸ 暫停';
            startBtn.className = 'btn btn-pause';
            
            // 啟用重設按鈕
            resetBtn.disabled = false;
            resetBtn.classList.add('enabled');
        } else if (currentState === 'start') {
            // 進入「時間暫停」狀態
            pauseTimer();
            currentState = 'pause';
            
            // UI 切換為繼續外觀
            startBtn.textContent = '▶ 繼續';
            startBtn.className = 'btn btn-start';
        }
    });

    resetBtn.addEventListener('click', () => {
        if (currentState === 'start' || currentState === 'pause') {
            // 點擊重設，回到「碼表首頁」狀態
            resetTimer();
            currentState = 'index';
            
            // UI 回復初始設定
